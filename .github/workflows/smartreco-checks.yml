name: SmartReco Challenge Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  challenge-checks:
    name: Challenge automated checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q app tests

      - name: Validate required dependencies and Mesh integration
        run: |
          python -c "import chromadb, fastapi, jinja2, langgraph, meshapi, sqlalchemy"
          python -c "from app.ai.mesh.client import MeshRecommendationClient; from app.ai.retrieval.embeddings import MeshEmbeddingService"

      - name: Run repository advisory checks
        run: |
          test -f README.md
          test -f .gitignore
          git check-ignore -q .env

      - name: Validate required challenge secrets
        env:
          MESH_API_KEY: ${{ secrets.MESH_API_KEY }}
          SUBMISSION_TOKEN: ${{ secrets.SUBMISSION_TOKEN }}
        run: |
          test -n "$MESH_API_KEY"
          test -n "$SUBMISSION_TOKEN"
