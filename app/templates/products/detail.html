{% extends "base.html" %}
{% block title %}{{ product.title }} | SmartReco{% endblock %}
{% block content %}
<a class="back-link" href="/products">← Back to catalog</a>
<article class="product-detail">
  <p class="category">{{ product.category }}</p>
  <h1>{{ product.title }}</h1>
  <p class="price">${{ '%.2f'|format(product.price) }}</p>
  <p class="description">{{ product.description }}</p>
</article>
{% endblock %}
