<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SmartReco{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/site.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/products">SmartReco</a>
      {% if current_user %}
      <nav aria-label="Primary navigation">
        <a href="/products">Catalog</a>
        <a href="/recommendations">Recommendations</a>
        {% if current_user.role.value == 'ADMIN' %}<a href="/admin/products">Admin</a>{% endif %}
        <form action="/logout" method="post">
          <button type="submit" class="link-button">Logout</button>
        </form>
      </nav>
      {% endif %}
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    {% if current_user %}
    <script>
      window.SmartRecoContext = {
        userId: {{ current_user.id | string | tojson }},
        useCookieAuth: true,
        productView: {{ tracking_product_view | tojson }},
        timeTracking: {{ tracking_time_spent | tojson }}
      };
    </script>
    <script src="{{ url_for('static', path='js/tracker.js') }}" defer></script>
    <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
    {% endif %}
  </body>
</html>
