{% extends "base.html" %}
{% block title %}{{ 'Edit product' if product else 'Create product' }} | SmartReco{% endblock %}
{% block content %}
<a class="back-link" href="/admin/products">← Back to products</a>
<section class="auth-card">
  <p class="eyebrow">Admin catalog</p><h1>{{ 'Edit product' if product else 'Create product' }}</h1>
  {% if error %}<p class="message error" role="alert">{{ error }}</p>{% endif %}
  <form class="stacked-form" action="{{ '/admin/products/' ~ product.id if product else '/admin/products' }}" method="post">
    <label>Title<input name="title" required value="{{ product.title if product else values.get('title', '') }}"></label>
    <label>Description<textarea name="description" required rows="5">{{ product.description if product else values.get('description', '') }}</textarea></label>
    <label>Category<input name="category" required value="{{ product.category if product else values.get('category', '') }}"></label>
    <label>Price<input name="price" type="number" min="0" step="0.01" required value="{{ product.price if product else values.get('price', '') }}"></label>
    <label class="checkbox-label"><input name="is_active" type="checkbox" {% if (product and product.is_active) or (not product and values.get('is_active', is_active)) %}checked{% endif %}> Available in catalog</label>
    <button type="submit">{{ 'Save product' if product else 'Create product' }}</button>
  </form>
</section>
{% endblock %}
