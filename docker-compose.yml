services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartreco}
      POSTGRES_USER: ${POSTGRES_USER:-smartreco}
      # This default is only for local evaluation. Override it in .env elsewhere.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartreco}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartreco}:${POSTGRES_PASSWORD:-smartreco}@db:5432/${POSTGRES_DB:-smartreco}
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - chroma_data:/app/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/v1/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
  chroma_data:
